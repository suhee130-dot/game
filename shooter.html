<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Sky Blaze</title>
<style>
  html,body{margin:0;height:100%;background:#05030f;overflow:hidden;font-family:system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif;color:#fff;user-select:none;-webkit-user-select:none}
  canvas{display:block;margin:0 auto;touch-action:none}
</style>
</head>
<body>
<a href="index.html" style="position:fixed;left:12px;bottom:12px;z-index:5;color:#fff;text-decoration:none;font:700 14px system-ui;padding:8px 14px;border:1px solid rgba(255,255,255,.3);border-radius:20px;background:rgba(0,0,0,.35)">← 메뉴 (Esc)</a>
<canvas id="c"></canvas>
<script>
(() => {
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const W = 540, H = 900;
let scale = 1, dpr = Math.min(window.devicePixelRatio || 1, 2);
function resize(){
  scale = Math.min(innerWidth / W, innerHeight / H);
  cv.style.width = W*scale + 'px'; cv.style.height = H*scale + 'px';
  cv.width = W*dpr; cv.height = H*dpr;
}
addEventListener('resize', resize); resize();

// ---------- utils ----------
const rand = (a,b) => a + Math.random()*(b-a);
const clamp = (v,a,b) => v<a?a:v>b?b:v;
const lerp = (a,b,t) => a+(b-a)*t;
const dist2 = (a,b) => (a.x-b.x)**2 + (a.y-b.y)**2;
const ease = t => 1-Math.pow(1-t,3);
const TAU = Math.PI*2;

// ---------- audio (synth) ----------
let actx = null;
function audio(){ if(!actx){ try{ actx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } return actx; }
function sfx(type){
  const a = actx; if(!a) return;
  const t = a.currentTime, o = a.createOscillator(), g = a.createGain();
  o.connect(g); g.connect(a.destination);
  if(type==='shoot'){ o.type='square'; o.frequency.setValueAtTime(880,t); o.frequency.exponentialRampToValueAtTime(220,t+.07); g.gain.setValueAtTime(.025,t); g.gain.exponentialRampToValueAtTime(.001,t+.07); o.start(t); o.stop(t+.08); }
  else if(type==='hit'){ o.type='triangle'; o.frequency.setValueAtTime(300,t); o.frequency.exponentialRampToValueAtTime(120,t+.05); g.gain.setValueAtTime(.04,t); g.gain.exponentialRampToValueAtTime(.001,t+.06); o.start(t); o.stop(t+.07); }
  else if(type==='boom' || type==='bigboom'){
    const big = type==='bigboom', len = big?1.2:.45;
    const buf = a.createBuffer(1, a.sampleRate*len, a.sampleRate), d = buf.getChannelData(0);
    for(let i=0;i<d.length;i++) d[i] = (Math.random()*2-1)*Math.pow(1-i/d.length, big?1.5:2.5);
    const s = a.createBufferSource(); s.buffer = buf;
    const f = a.createBiquadFilter(); f.type='lowpass'; f.frequency.setValueAtTime(big?1200:2000,t); f.frequency.exponentialRampToValueAtTime(80,t+len);
    s.connect(f); f.connect(g); g.gain.setValueAtTime(big?.5:.18,t); s.start(t);
    o.disconnect();
  }
  else if(type==='power'){ o.type='sine'; o.frequency.setValueAtTime(400,t); o.frequency.exponentialRampToValueAtTime(1600,t+.25); g.gain.setValueAtTime(.12,t); g.gain.exponentialRampToValueAtTime(.001,t+.3); o.start(t); o.stop(t+.3); }
  else if(type==='hurt'){ o.type='sawtooth'; o.frequency.setValueAtTime(200,t); o.frequency.exponentialRampToValueAtTime(40,t+.4); g.gain.setValueAtTime(.15,t); g.gain.exponentialRampToValueAtTime(.001,t+.4); o.start(t); o.stop(t+.4); }
  else if(type==='warn'){ o.type='square'; o.frequency.setValueAtTime(440,t); o.frequency.setValueAtTime(330,t+.25); g.gain.setValueAtTime(.06,t); g.gain.setValueAtTime(.06,t+.45); g.gain.exponentialRampToValueAtTime(.001,t+.5); o.start(t); o.stop(t+.5); }
}

// ---------- input ----------
const keys = {};
addEventListener('keydown', e => { if(e.code==='Escape'){ location.href='index.html'; return; } keys[e.code] = true; if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code)) e.preventDefault(); onAnyInput(e.code); });
addEventListener('keyup', e => keys[e.code] = false);
let pointer = null;
function toGame(e){ const r = cv.getBoundingClientRect(); return {x:(e.clientX-r.left)/scale, y:(e.clientY-r.top)/scale}; }
cv.addEventListener('pointerdown', e => { pointer = {...toGame(e), ox:player.x, oy:player.y}; pointer.sx=pointer.x; pointer.sy=pointer.y; onAnyInput('Pointer'); });
cv.addEventListener('pointermove', e => { if(pointer){ const p = toGame(e); pointer.x=p.x; pointer.y=p.y; } });
addEventListener('pointerup', () => pointer = null);

// ---------- state ----------
let state = 'title'; // title | play | over
let time = 0, shake = 0, flash = 0, flashColor = '#fff', slowmo = 1, hitstop = 0;
let score = 0, shownScore = 0, best = +(localStorageGet('skyblaze_best')||0);
let combo = 0, comboTimer = 0, wave = 0, waveTimer = 0, bannerText = '', bannerT = 0;
let boss = null, bossWarn = 0;
function localStorageGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function localStorageSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }

const player = { x:W/2, y:H-150, vx:0, hp:5, maxHp:5, power:1, inv:0, fire:0, bank:0, shield:0, bombs:2, alive:true, trail:[] };
let bullets=[], ebullets=[], enemies=[], parts=[], rings=[], texts=[], items=[], debris=[];

// background layers
const stars = [...Array(140)].map(() => ({x:rand(0,W), y:rand(0,H), z:rand(.2,1)}));
const clouds = [...Array(7)].map(() => ({x:rand(-50,W), y:rand(0,H), r:rand(80,180), s:rand(.5,1)}));
const speedLines = [];

function reset(){
  Object.assign(player,{x:W/2,y:H-150,hp:5,power:1,inv:2,fire:0,bank:0,shield:0,bombs:2,alive:true,trail:[]});
  bullets=[];ebullets=[];enemies=[];parts=[];rings=[];texts=[];items=[];debris=[];
  score=0;shownScore=0;combo=0;comboTimer=0;wave=0;waveTimer=1.5;boss=null;bossWarn=0;slowmo=1;
  banner('STAGE START');
}
function banner(t){ bannerText=t; bannerT=2.2; }

function onAnyInput(code){
  audio(); if(actx && actx.state==='suspended') actx.resume();
  if(state==='title' || (state==='over' && overT>1.2)){ state='play'; reset(); }
  else if(state==='play' && (code==='KeyB' || code==='KeyX')) useBomb();
}

// ---------- effects ----------
function explode(x,y,size=1,hue=30){
  const n = Math.floor(22*size);
  for(let i=0;i<n;i++){
    const a = rand(0,TAU), s = rand(60,380)*size;
    parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:rand(.4,1)*(.6+size*.4),max:1,r:rand(2,5)*size,hue:hue+rand(-20,20),type:'spark',drag:.92});
  }
  for(let i=0;i<Math.floor(8*size);i++){
    const a = rand(0,TAU), s = rand(20,120)*size;
    parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:rand(.6,1.2),max:1.2,r:rand(10,26)*size,hue,type:'smoke',drag:.95});
  }
  for(let i=0;i<Math.floor(5*size);i++){
    const a = rand(0,TAU), s = rand(100,300)*size;
    debris.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,rot:rand(0,TAU),vr:rand(-12,12),life:rand(.6,1.2),s:rand(3,8)*size,hue});
  }
  rings.push({x,y,r:5,max:80*size,life:.5,t:0,w:8*size,hue});
  if(size>1.5) rings.push({x,y,r:5,max:160*size,life:.8,t:0,w:4*size,hue:50});
  parts.push({x,y,vx:0,vy:0,life:.18,max:.18,r:60*size,hue:50,type:'flash',drag:1});
  shake = Math.max(shake, 6*size);
}
function hitSpark(x,y,hue=190){
  for(let i=0;i<5;i++){ const a = rand(-Math.PI*0.9,-Math.PI*0.1), s=rand(80,240);
    parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:rand(.15,.3),max:.3,r:rand(1.5,3),hue,type:'spark',drag:.9}); }
}
function popText(x,y,t,color='#fff',size=22){ texts.push({x,y,t,color,size,life:1,vy:-80}); }

// ---------- player shooting ----------
function shoot(){
  const p = player, lv = p.power;
  const mk = (dx,ang,dmg=1,kind='main') => bullets.push({x:p.x+dx,y:p.y-30,vx:Math.sin(ang)*900,vy:-Math.cos(ang)*900,dmg,kind,life:1.2});
  mk(-6,0); mk(6,0);
  if(lv>=2){ mk(-18,-.08); mk(18,.08); }
  if(lv>=3){ mk(-28,-.2); mk(28,.2); }
  if(lv>=4 && Math.floor(time*6)%2===0){ // homing missiles
    bullets.push({x:p.x-24,y:p.y,vx:-200,vy:-200,dmg:3,kind:'missile',life:2.5});
    bullets.push({x:p.x+24,y:p.y,vx:200,vy:-200,dmg:3,kind:'missile',life:2.5});
  }
  // muzzle flash
  parts.push({x:p.x,y:p.y-34,vx:0,vy:0,life:.06,max:.06,r:18,hue:190,type:'flash',drag:1});
  sfx('shoot');
}
function useBomb(){
  if(player.bombs<=0 || !player.alive) return;
  player.bombs--; flash=1; flashColor='#9ff'; shake=25; slowmo=.3; sfx('bigboom');
  for(let i=0;i<4;i++) rings.push({x:player.x,y:player.y,r:10,max:900,life:.9+i*.15,t:-i*.08,w:30-i*6,hue:180+i*20});
  ebullets.forEach(b => { hitSpark(b.x,b.y,180); score+=10; }); ebullets=[];
  enemies.forEach(e => damageEnemy(e, 40));
  if(boss) damageBoss(60);
  popText(player.x,player.y-60,'BOMB!!','#8ff',40);
}

// ---------- enemies ----------
const ETYPES = {
  drone:  {hp:3,  r:20, score:100, hue:330, speed:170},
  zig:    {hp:4,  r:22, score:150, hue:280, speed:140},
  tank:   {hp:18, r:36, score:500, hue:15,  speed:60},
  kamikaze:{hp:2, r:16, score:120, hue:50,  speed:120},
  turret: {hp:10, r:28, score:300, hue:150, speed:90},
};
function spawnEnemy(type,x,y,opt={}){
  const T = ETYPES[type];
  enemies.push({type,x,y,hp:T.hp*(1+wave*.08),maxHp:T.hp*(1+wave*.08),r:T.r,hue:T.hue,score:T.score,speed:T.speed,t:0,fire:rand(.5,2),flash:0,spawn:0,ox:x,...opt});
}
function nextWave(){
  wave++;
  if(wave%5===0){ startBoss(); return; }
  const pat = (wave-1)%4, n = 5+Math.min(wave,8);
  if(pat===0){ for(let i=0;i<n;i++) spawnEnemy('drone', 60+((W-120)/(n-1))*i, -40-i*30, {path:'sine'}); }
  else if(pat===1){ for(let i=0;i<n;i++) spawnEnemy('zig', i%2?W*.75:W*.25, -40-i*55, {path:'zig', dir:i%2?-1:1}); spawnEnemy('tank',W/2,-120); }
  else if(pat===2){ for(let i=0;i<n;i++) spawnEnemy('kamikaze', rand(40,W-40), -40-i*45, {path:'dive'}); spawnEnemy('turret',W*.25,-60,{path:'stop'}); spawnEnemy('turret',W*.75,-60,{path:'stop'}); }
  else { for(let i=0;i<n;i++){ const side=i%2; spawnEnemy('drone', side?W+40:-40, 80+i*25, {path:'swoop', dir:side?-1:1, delay:i*.18}); } spawnEnemy('tank',W*.3,-100); spawnEnemy('tank',W*.7,-160); }
  banner('WAVE ' + wave);
}
function startBoss(){
  bossWarn = 3; sfx('warn');
  setTimeout(()=>sfx('warn'),600); setTimeout(()=>sfx('warn'),1200);
}
function makeBoss(){
  const lvl = wave/5;
  boss = {x:W/2,y:-160,ty:170,hp:300*lvl,maxHp:300*lvl,t:0,phase:0,fire:0,flash:0,dying:0,r:80,pat:0,patT:0};
}
function damageEnemy(e,d){
  e.hp -= d; e.flash = .08;
  if(e.hp<=0 && !e.dead){
    e.dead = true;
    const big = e.type==='tank'?2:e.type==='turret'?1.5:1;
    explode(e.x,e.y,big,e.hue); sfx(big>1?'bigboom':'boom');
    combo++; comboTimer = 2;
    const mult = 1 + Math.floor(combo/10)*.5;
    const pts = Math.round(e.score*mult); score += pts;
    popText(e.x,e.y,'+'+pts, `hsl(${e.hue},100%,75%)`, big>1?28:20);
    if(combo>0 && combo%10===0){ popText(W/2,H*.4,combo+' COMBO!','#ff0',44); rings.push({x:W/2,y:H*.4,r:10,max:200,life:.6,t:0,w:6,hue:55}); }
    if(Math.random() < (big>1?.6:.1)) dropItem(e.x,e.y);
    if(big>1) hitstop = .05;
  }
}
function dropItem(x,y){
  const r = Math.random(), kind = r<.55?'P':r<.8?'H':r<.92?'S':'B';
  items.push({x,y,vx:rand(-60,60),vy:-120,kind,t:0});
}
function damageBoss(d){
  if(!boss || boss.dying) return;
  boss.hp -= d; boss.flash = .06;
  if(boss.hp<=0){ boss.dying = 3; boss.hp=0; slowmo=.25; sfx('bigboom'); flash=1; flashColor='#fff'; ebullets=[]; }
}

// ---------- update ----------
let overT = 0;
function update(dt){
  time += dt;
  if(hitstop>0){ hitstop-=dt; return; }
  slowmo = lerp(slowmo,1,dt*1.5);
  const gdt = dt*slowmo;

  // background
  const spd = state==='play'?1:.5;
  stars.forEach(s => { s.y += (40+s.z*380)*gdt*spd; if(s.y>H){ s.y=-5; s.x=rand(0,W); } });
  clouds.forEach(c => { c.y += 90*c.s*gdt*spd; if(c.y-c.r>H){ c.y=-c.r-rand(0,200); c.x=rand(-50,W); } });
  if(Math.random()<.4) speedLines.push({x:rand(0,W),y:-50,l:rand(40,120),s:rand(900,1500)});
  for(let i=speedLines.length-1;i>=0;i--){ const l=speedLines[i]; l.y+=l.s*gdt; if(l.y>H+100) speedLines.splice(i,1); }

  shake = Math.max(0, shake - dt*40);
  flash = Math.max(0, flash - dt*3);
  shownScore = lerp(shownScore, score, Math.min(1,dt*10));
  if(bannerT>0) bannerT -= dt;

  if(state==='play') updatePlay(gdt);
  if(state==='over') overT += dt;

  // particles
  for(let i=parts.length-1;i>=0;i--){ const p=parts[i]; p.life-=gdt; if(p.life<=0){parts.splice(i,1);continue;}
    p.x+=p.vx*gdt; p.y+=p.vy*gdt; const d=Math.pow(p.drag,gdt*60); p.vx*=d; p.vy*=d; if(p.type==='smoke'){ p.r+=gdt*20; p.y+=30*gdt; } }
  for(let i=debris.length-1;i>=0;i--){ const p=debris[i]; p.life-=gdt; if(p.life<=0){debris.splice(i,1);continue;}
    p.x+=p.vx*gdt; p.y+=p.vy*gdt; p.vy+=300*gdt; p.rot+=p.vr*gdt;
    if(Math.random()<.5) parts.push({x:p.x,y:p.y,vx:0,vy:0,life:.3,max:.3,r:p.s*.7,hue:p.hue,type:'smoke',drag:1}); }
  for(let i=rings.length-1;i>=0;i--){ const r=rings[i]; r.t+=gdt; if(r.t>=r.life){rings.splice(i,1);} }
  for(let i=texts.length-1;i>=0;i--){ const t=texts[i]; t.life-=dt*1.2; t.y+=t.vy*dt; t.vy*=.95; if(t.life<=0) texts.splice(i,1); }
}

function updatePlay(dt){
  const p = player;
  // waves
  if(!boss && bossWarn<=0 && enemies.length===0){ waveTimer -= dt; if(waveTimer<=0){ nextWave(); waveTimer=1.6; } }
  if(bossWarn>0){ bossWarn -= dt; if(bossWarn<=0) makeBoss(); }
  if(comboTimer>0){ comboTimer-=dt; if(comboTimer<=0) combo=0; }

  // movement
  if(p.alive){
    let mx=0,my=0;
    if(keys.ArrowLeft||keys.KeyA) mx-=1; if(keys.ArrowRight||keys.KeyD) mx+=1;
    if(keys.ArrowUp||keys.KeyW) my-=1; if(keys.ArrowDown||keys.KeyS) my+=1;
    const sp = 420;
    const px = p.x;
    if(pointer){ const tx = pointer.ox + (pointer.x-pointer.sx)*1.3, ty = pointer.oy + (pointer.y-pointer.sy)*1.3;
      p.x = lerp(p.x, tx, Math.min(1,dt*18)); p.y = lerp(p.y, ty, Math.min(1,dt*18)); }
    else { const l=Math.hypot(mx,my)||1; p.x += mx/l*sp*dt; p.y += my/l*sp*dt; }
    p.x = clamp(p.x,24,W-24); p.y = clamp(p.y,60,H-40);
    p.vx = (p.x-px)/Math.max(dt,1e-4);
    p.bank = lerp(p.bank, clamp(p.vx/400,-1,1), Math.min(1,dt*10));
    p.fire -= dt; if(p.fire<=0){ shoot(); p.fire = .09; }
    p.inv = Math.max(0,p.inv-dt); p.shield = Math.max(0,p.shield-dt);
    p.trail.push({x:p.x,y:p.y+20}); if(p.trail.length>14) p.trail.shift();
    // engine particles
    for(const ox of [-9,9]) parts.push({x:p.x+ox+rand(-2,2),y:p.y+28,vx:rand(-20,20),vy:rand(250,400),life:.2,max:.2,r:rand(3,6),hue:rand(180,210),type:'spark',drag:.9});
  }

  // bullets
  for(let i=bullets.length-1;i>=0;i--){
    const b=bullets[i]; b.life-=dt;
    if(b.kind==='missile'){
      let tgt=null, bd=1e9;
      for(const e of enemies){ const d=dist2(b,e); if(d<bd){bd=d;tgt=e;} }
      if(boss && !boss.dying){ const d=dist2(b,boss); if(d<bd){tgt=boss;} }
      if(tgt){ const a=Math.atan2(tgt.y-b.y,tgt.x-b.x), s=650; b.vx=lerp(b.vx,Math.cos(a)*s,dt*5); b.vy=lerp(b.vy,Math.sin(a)*s,dt*5); }
      else b.vy -= 800*dt;
      parts.push({x:b.x,y:b.y,vx:0,vy:0,life:.25,max:.25,r:4,hue:30,type:'smoke',drag:1});
    }
    b.x+=b.vx*dt; b.y+=b.vy*dt;
    let hit=false;
    for(const e of enemies){ if(e.dead) continue; if(dist2(b,e) < (e.r+6)**2){ damageEnemy(e,b.dmg); hitSpark(b.x,b.y,e.hue); hit=true; sfx('hit'); break; } }
    if(!hit && boss && !boss.dying && Math.abs(b.x-boss.x)<boss.r*1.3 && Math.abs(b.y-boss.y)<boss.r*.7){ damageBoss(b.dmg); hitSpark(b.x,b.y,0); hit=true; score+=5; }
    if(hit || b.life<=0 || b.y<-30 || b.x<-30 || b.x>W+30) bullets.splice(i,1);
  }

  // enemies
  for(let i=enemies.length-1;i>=0;i--){
    const e=enemies[i];
    if(e.dead){ enemies.splice(i,1); continue; }
    if(e.delay>0){ e.delay-=dt; continue; }
    e.t+=dt; e.spawn=Math.min(1,e.spawn+dt*2.5); e.flash=Math.max(0,e.flash-dt);
    if(e.path==='sine'){ e.y+=e.speed*dt; e.x=e.ox+Math.sin(e.t*2.5)*60; }
    else if(e.path==='zig'){ e.y+=e.speed*dt; e.x+=e.dir*220*dt; if(e.x<40||e.x>W-40) e.dir*=-1; }
    else if(e.path==='dive'){ if(e.t<1.2){ e.y+=e.speed*dt; } else { if(!e.locked){ e.locked=true; const a=Math.atan2(p.y-e.y,p.x-e.x); e.vx=Math.cos(a)*520; e.vy=Math.sin(a)*520; for(let k=0;k<6;k++) hitSpark(e.x,e.y,50);} e.x+=e.vx*dt; e.y+=e.vy*dt; parts.push({x:e.x,y:e.y,vx:0,vy:0,life:.3,max:.3,r:7,hue:40,type:'spark',drag:1}); } }
    else if(e.path==='swoop'){ e.x+=e.dir*260*dt; e.y+=Math.sin(e.t*3)*120*dt + 40*dt; }
    else if(e.path==='stop'){ if(e.y<160) e.y+=e.speed*dt; else if(e.t>9) e.y+=e.speed*1.5*dt; }
    else e.y+=e.speed*dt;
    // firing
    e.fire-=dt;
    if(e.fire<=0 && e.y>0 && e.y<H*.7){
      if(e.type==='drone'||e.type==='zig'){ aimShot(e,220); e.fire=rand(1.6,3); }
      else if(e.type==='tank'){ for(let k=-2;k<=2;k++) angShot(e, Math.atan2(p.y-e.y,p.x-e.x)+k*.18, 200); e.fire=1.8; }
      else if(e.type==='turret'){ for(let k=0;k<10;k++) angShot(e, k/10*TAU+e.t, 160, 'ring'); e.fire=1.4; }
      else e.fire=99;
    }
    if(p.alive && p.inv<=0 && dist2(e,p) < (e.r+14)**2){ hurtPlayer(); damageEnemy(e,999); }
    if(e.y>H+80 || e.x<-120 || e.x>W+120) enemies.splice(i,1);
  }

  // boss
  if(boss) updateBoss(dt);

  // enemy bullets
  for(let i=ebullets.length-1;i>=0;i--){
    const b=ebullets[i]; b.x+=b.vx*dt; b.y+=b.vy*dt; b.t+=dt;
    if(p.alive && p.shield>0 && dist2(b,p)<50**2){ hitSpark(b.x,b.y,190); ebullets.splice(i,1); continue; }
    if(p.alive && p.inv<=0 && dist2(b,p) < (b.r+6)**2){ hurtPlayer(); ebullets.splice(i,1); continue; }
    if(b.y>H+20||b.y<-40||b.x<-20||b.x>W+20) ebullets.splice(i,1);
  }

  // items
  for(let i=items.length-1;i>=0;i--){
    const it=items[i]; it.t+=dt; it.vy=Math.min(it.vy+200*dt,110); it.vx*=.97;
    if(p.alive && dist2(it,p)<140**2){ const a=Math.atan2(p.y-it.y,p.x-it.x); it.x+=Math.cos(a)*400*dt; it.y+=Math.sin(a)*400*dt; }
    it.x+=it.vx*dt; it.y+=it.vy*dt;
    if(p.alive && dist2(it,p)<30**2){
      sfx('power'); rings.push({x:p.x,y:p.y,r:10,max:70,life:.4,t:0,w:5,hue:it.kind==='H'?120:it.kind==='S'?190:it.kind==='B'?280:45});
      if(it.kind==='P'){ if(p.power<4){p.power++; popText(p.x,p.y-50,'POWER UP!','#fd4',28);} else { score+=1000; popText(p.x,p.y-50,'+1000','#fd4',24);} }
      if(it.kind==='H'){ p.hp=Math.min(p.maxHp,p.hp+1); popText(p.x,p.y-50,'+HP','#6f6',26); }
      if(it.kind==='S'){ p.shield=8; popText(p.x,p.y-50,'SHIELD','#6ef',26); }
      if(it.kind==='B'){ p.bombs=Math.min(5,p.bombs+1); popText(p.x,p.y-50,'+BOMB','#c8f',26); }
      items.splice(i,1); continue;
    }
    if(it.y>H+30) items.splice(i,1);
  }
}

function aimShot(e,s){ angShot(e, Math.atan2(player.y-e.y, player.x-e.x), s); }
function angShot(e,a,s,kind='orb'){ ebullets.push({x:e.x,y:e.y+10,vx:Math.cos(a)*s,vy:Math.sin(a)*s,r:kind==='big'?10:6,kind,t:0,hue:e.hue??0}); }

function updateBoss(dt){
  const b=boss; b.t+=dt; b.flash=Math.max(0,b.flash-dt);
  if(b.dying){
    b.dying-=dt; b.y+=20*dt; shake=Math.max(shake,8);
    if(Math.random()<.35){ explode(b.x+rand(-90,90), b.y+rand(-50,50), rand(.8,1.6), rand(0,50)); sfx('boom'); }
    if(b.dying<=0){
      explode(b.x,b.y,4,30); flash=1; flashColor='#fff'; shake=40; sfx('bigboom');
      const pts = 20000*wave/5; score+=pts; popText(b.x,b.y,'+'+pts,'#ff0',48);
      for(let k=0;k<6;k++) dropItem(b.x+rand(-60,60), b.y);
      banner('BOSS DEFEATED!'); boss=null; waveTimer=3;
    }
    return;
  }
  b.y = lerp(b.y, b.ty + Math.sin(b.t*.8)*20, dt*1.5);
  b.x = W/2 + Math.sin(b.t*.5)*140;
  const rage = b.hp < b.maxHp*.4;
  b.patT -= dt;
  if(b.patT<=0){ b.pat=(b.pat+1)%3; b.patT=rage?4:5; }
  b.fire -= dt;
  if(b.fire<=0 && b.y>100){
    const e={x:b.x,y:b.y+30,hue:0};
    if(b.pat===0){ for(let k=0;k<(rage?3:2);k++) angShot({x:b.x,y:b.y,hue:0}, b.t*3+k*TAU/(rage?3:2), 220); for(let k=0;k<(rage?3:2);k++) angShot({x:b.x,y:b.y,hue:300}, -b.t*3+k*TAU/(rage?3:2), 180); b.fire=.08; }
    else if(b.pat===1){ for(let k=-3;k<=3;k++) angShot(e, Math.atan2(player.y-e.y,player.x-e.x)+k*.12, 300); b.fire=rage?.5:.8; }
    else { for(let k=0;k<24;k++) angShot({x:b.x,y:b.y,hue:40}, k/24*TAU + b.t, 150, 'big'); for(const ox of [-90,90]) angShot({x:b.x+ox,y:b.y+20,hue:200}, Math.PI/2, 350); b.fire=rage?.9:1.3; }
  }
  if(player.alive && player.inv<=0 && Math.abs(player.x-b.x)<b.r*1.2 && Math.abs(player.y-b.y)<b.r*.6) hurtPlayer();
}

function hurtPlayer(){
  const p=player;
  if(p.shield>0){ p.shield=0; p.inv=1; rings.push({x:p.x,y:p.y,r:20,max:120,life:.4,t:0,w:6,hue:190}); return; }
  p.hp--; p.inv=2; p.power=Math.max(1,p.power-1); combo=0;
  shake=20; flash=.7; flashColor='#f33'; sfx('hurt'); hitstop=.08;
  explode(p.x,p.y,1,200);
  if(p.hp<=0){
    p.alive=false; explode(p.x,p.y,3,200); sfx('bigboom'); slowmo=.2;
    state='over'; overT=0;
    if(score>best){ best=score; localStorageSet('skyblaze_best',best); }
  }
}

// ---------- drawing ----------
function drawBG(){
  const g = ctx.createLinearGradient(0,0,0,H);
  const h = (time*4)%360;
  g.addColorStop(0, `hsl(${250+Math.sin(time*.1)*20},60%,8%)`);
  g.addColorStop(.6, `hsl(${280+Math.sin(time*.13)*25},55%,14%)`);
  g.addColorStop(1, `hsl(${320+Math.sin(time*.07)*20},60%,20%)`);
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  // planet glow
  ctx.save(); ctx.globalAlpha=.35;
  const pg = ctx.createRadialGradient(W*.8, H*.2+Math.sin(time*.2)*10, 10, W*.8, H*.2, 200);
  pg.addColorStop(0,'rgba(255,120,220,.6)'); pg.addColorStop(1,'rgba(255,120,220,0)');
  ctx.fillStyle=pg; ctx.fillRect(0,0,W,H); ctx.restore();
  // stars
  for(const s of stars){ ctx.fillStyle=`rgba(255,255,255,${s.z*.9})`; const l = s.z*s.z*14; ctx.fillRect(s.x, s.y, s.z*2, Math.max(s.z*2,l)); }
  // grid floor
  ctx.save(); ctx.globalAlpha=.12; ctx.strokeStyle='#f6f'; ctx.lineWidth=1;
  const off = (time*220)%60;
  for(let y=off; y<H; y+=60){ ctx.globalAlpha=.03 + (y/H)*.13; ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke(); }
  ctx.restore();
  // clouds
  for(const c of clouds){ const cg=ctx.createRadialGradient(c.x,c.y,0,c.x,c.y,c.r); cg.addColorStop(0,`rgba(180,140,255,${.07*c.s})`); cg.addColorStop(1,'rgba(180,140,255,0)'); ctx.fillStyle=cg; ctx.beginPath(); ctx.arc(c.x,c.y,c.r,0,TAU); ctx.fill(); }
  // speed lines
  ctx.strokeStyle='rgba(200,220,255,.12)'; ctx.lineWidth=1.5;
  for(const l of speedLines){ ctx.beginPath(); ctx.moveTo(l.x,l.y); ctx.lineTo(l.x,l.y+l.l); ctx.stroke(); }
}

function drawPlayer(){
  const p=player; if(!p.alive) return;
  if(p.inv>0 && Math.floor(time*20)%2===0) return;
  // trail
  ctx.save(); ctx.globalCompositeOperation='lighter';
  for(let i=0;i<p.trail.length;i++){ const t=p.trail[i], a=i/p.trail.length; ctx.fillStyle=`hsla(190,100%,60%,${a*.25})`; ctx.beginPath(); ctx.arc(t.x,t.y+ (p.trail.length-i)*4, 10*a, 0, TAU); ctx.fill(); }
  ctx.restore();
  ctx.save(); ctx.translate(p.x,p.y);
  const sx = 1 - Math.abs(p.bank)*.35;
  ctx.scale(sx,1);
  // glow
  ctx.shadowColor='#3ef'; ctx.shadowBlur=24;
  // wings
  const wg = ctx.createLinearGradient(-40,0,40,0);
  wg.addColorStop(0, p.bank<0?'#1a6':'#0bd'); wg.addColorStop(.5,'#eff'); wg.addColorStop(1, p.bank>0?'#1a6':'#0bd');
  ctx.fillStyle=wg;
  ctx.beginPath(); ctx.moveTo(0,-34); ctx.lineTo(8,-10); ctx.lineTo(38,12); ctx.lineTo(38,20); ctx.lineTo(10,14); ctx.lineTo(8,26); ctx.lineTo(-8,26); ctx.lineTo(-10,14); ctx.lineTo(-38,20); ctx.lineTo(-38,12); ctx.lineTo(-8,-10); ctx.closePath(); ctx.fill();
  ctx.shadowBlur=0;
  // body
  ctx.fillStyle='#2a3d66'; ctx.beginPath(); ctx.moveTo(0,-30); ctx.lineTo(6,-6); ctx.lineTo(5,22); ctx.lineTo(-5,22); ctx.lineTo(-6,-6); ctx.closePath(); ctx.fill();
  // cockpit
  const cg=ctx.createLinearGradient(0,-22,0,-4); cg.addColorStop(0,'#fff'); cg.addColorStop(1,'#0af');
  ctx.fillStyle=cg; ctx.beginPath(); ctx.ellipse(0,-12,3.5,9,0,0,TAU); ctx.fill();
  // wing tips lights
  const blink = Math.sin(time*10)>0;
  ctx.fillStyle = blink?'#f44':'#600'; ctx.fillRect(-39,12,3,6);
  ctx.fillStyle = blink?'#4f4':'#060'; ctx.fillRect(36,12,3,6);
  // engines
  ctx.globalCompositeOperation='lighter';
  for(const ox of [-9,9]){ const fl = 14+Math.random()*10; const eg=ctx.createRadialGradient(ox,26,0,ox,26+fl/2,fl); eg.addColorStop(0,'rgba(255,255,255,1)'); eg.addColorStop(.3,'rgba(80,220,255,.9)'); eg.addColorStop(1,'rgba(0,80,255,0)'); ctx.fillStyle=eg; ctx.beginPath(); ctx.ellipse(ox,28+fl/3,6,fl,0,0,TAU); ctx.fill(); }
  ctx.restore();
  // shield
  if(p.shield>0){
    ctx.save(); ctx.globalCompositeOperation='lighter';
    const a = p.shield<2 && Math.floor(time*10)%2 ? .2 : .6;
    ctx.strokeStyle=`rgba(100,230,255,${a})`; ctx.lineWidth=3;
    for(let k=0;k<3;k++){ ctx.beginPath(); ctx.arc(p.x,p.y,46+Math.sin(time*6+k)*3, time*3+k*2.1, time*3+k*2.1+1.6); ctx.stroke(); }
    const sg=ctx.createRadialGradient(p.x,p.y,30,p.x,p.y,50); sg.addColorStop(0,'rgba(80,200,255,0)'); sg.addColorStop(1,`rgba(80,200,255,${a*.4})`);
    ctx.fillStyle=sg; ctx.beginPath(); ctx.arc(p.x,p.y,50,0,TAU); ctx.fill();
    ctx.restore();
  }
}

function drawEnemy(e){
  if(e.delay>0) return;
  ctx.save(); ctx.translate(e.x,e.y);
  const sc = ease(e.spawn); ctx.scale(sc,sc);
  const col = e.flash>0 ? '#fff' : `hsl(${e.hue},90%,55%)`;
  const dark = `hsl(${e.hue},70%,25%)`;
  ctx.shadowColor=`hsl(${e.hue},100%,60%)`; ctx.shadowBlur=18;
  const pulse = 1+Math.sin(time*8+e.x)*.06;
  if(e.type==='drone'){
    ctx.rotate(Math.sin(e.t*2.5)*.3);
    ctx.fillStyle=col; ctx.beginPath(); ctx.moveTo(0,20); ctx.lineTo(20,-8); ctx.lineTo(10,-14); ctx.lineTo(0,-4); ctx.lineTo(-10,-14); ctx.lineTo(-20,-8); ctx.closePath(); ctx.fill();
    ctx.fillStyle=dark; ctx.beginPath(); ctx.arc(0,0,6*pulse,0,TAU); ctx.fill();
    ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(0,0,2.5,0,TAU); ctx.fill();
  } else if(e.type==='zig'){
    ctx.rotate(e.t*4);
    ctx.fillStyle=col;
    for(let k=0;k<4;k++){ ctx.rotate(TAU/4); ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(8,-22); ctx.lineTo(-4,-18); ctx.closePath(); ctx.fill(); }
    ctx.fillStyle=dark; ctx.beginPath(); ctx.arc(0,0,9,0,TAU); ctx.fill();
    ctx.fillStyle='#fdf'; ctx.beginPath(); ctx.arc(0,0,4*pulse,0,TAU); ctx.fill();
  } else if(e.type==='tank'){
    ctx.fillStyle=dark; ctx.beginPath(); ctx.roundRect(-36,-24,72,48,10); ctx.fill();
    ctx.fillStyle=col; ctx.beginPath(); ctx.moveTo(-40,-10); ctx.lineTo(-20,-30); ctx.lineTo(20,-30); ctx.lineTo(40,-10); ctx.lineTo(30,26); ctx.lineTo(-30,26); ctx.closePath(); ctx.fill();
    ctx.fillStyle=dark; ctx.beginPath(); ctx.arc(0,0,14,0,TAU); ctx.fill();
    const a = Math.atan2(player.y-e.y,player.x-e.x)-Math.PI/2;
    ctx.save(); ctx.rotate(a); ctx.fillStyle='#ffd'; ctx.fillRect(-4,0,8,26); ctx.restore();
    ctx.fillStyle=`hsl(${e.hue},100%,80%)`; ctx.beginPath(); ctx.arc(0,0,6*pulse,0,TAU); ctx.fill();
    // hp bar
    ctx.shadowBlur=0; ctx.fillStyle='rgba(0,0,0,.5)'; ctx.fillRect(-30,-42,60,5); ctx.fillStyle='#f84'; ctx.fillRect(-30,-42,60*Math.max(0,e.hp/e.maxHp),5);
  } else if(e.type==='kamikaze'){
    if(e.locked) ctx.rotate(Math.atan2(e.vy,e.vx)-Math.PI/2); else ctx.rotate(Math.sin(time*30)*.1*(e.t>.8?1:0));
    ctx.fillStyle = e.t>.8 && !e.locked && Math.floor(time*20)%2 ? '#fff' : col;
    ctx.beginPath(); ctx.moveTo(0,20); ctx.lineTo(12,-12); ctx.lineTo(0,-6); ctx.lineTo(-12,-12); ctx.closePath(); ctx.fill();
  } else if(e.type==='turret'){
    ctx.rotate(e.t*1.5);
    ctx.fillStyle=col; ctx.beginPath(); for(let k=0;k<6;k++){ const a=k/6*TAU; ctx.lineTo(Math.cos(a)*28, Math.sin(a)*28); } ctx.closePath(); ctx.fill();
    ctx.fillStyle=dark; ctx.beginPath(); for(let k=0;k<6;k++){ const a=k/6*TAU+TAU/12; ctx.lineTo(Math.cos(a)*16, Math.sin(a)*16); } ctx.closePath(); ctx.fill();
    ctx.fillStyle='#efe'; ctx.beginPath(); ctx.arc(0,0,6*pulse,0,TAU); ctx.fill();
    // charge indicator
    if(e.fire<.4){ ctx.strokeStyle='#fff'; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(0,0,36-e.fire*40,0,TAU); ctx.stroke(); }
  }
  ctx.restore();
}

function drawBoss(){
  const b=boss; if(!b) return;
  ctx.save();
  let jx = b.dying ? rand(-5,5) : 0;
  ctx.translate(b.x+jx, b.y);
  const rage = b.hp < b.maxHp*.4;
  const hue = rage ? 0 : 290;
  const col = b.flash>0?'#fff':`hsl(${hue},80%,45%)`;
  ctx.shadowColor=`hsl(${hue},100%,60%)`; ctx.shadowBlur=30;
  // wings
  ctx.fillStyle=`hsl(${hue},60%,22%)`;
  ctx.beginPath(); ctx.moveTo(-130,-20); ctx.lineTo(-60,-50); ctx.lineTo(60,-50); ctx.lineTo(130,-20); ctx.lineTo(110,40); ctx.lineTo(60,20); ctx.lineTo(0,60); ctx.lineTo(-60,20); ctx.lineTo(-110,40); ctx.closePath(); ctx.fill();
  ctx.fillStyle=col;
  ctx.beginPath(); ctx.moveTo(-100,-15); ctx.lineTo(-50,-40); ctx.lineTo(50,-40); ctx.lineTo(100,-15); ctx.lineTo(80,20); ctx.lineTo(0,45); ctx.lineTo(-80,20); ctx.closePath(); ctx.fill();
  // rotating ring
  ctx.save(); ctx.rotate(b.t*(rage?3:1.2)); ctx.strokeStyle=`hsl(${hue+40},100%,70%)`; ctx.lineWidth=4; ctx.setLineDash([14,10]); ctx.beginPath(); ctx.arc(0,0,48,0,TAU); ctx.stroke(); ctx.restore();
  // core
  const pulse = 1+Math.sin(b.t*(rage?14:6))*.15;
  const cg=ctx.createRadialGradient(0,0,0,0,0,30*pulse); cg.addColorStop(0,'#fff'); cg.addColorStop(.4,`hsl(${hue+40},100%,65%)`); cg.addColorStop(1,`hsla(${hue},100%,50%,0)`);
  ctx.fillStyle=cg; ctx.beginPath(); ctx.arc(0,0,30*pulse,0,TAU); ctx.fill();
  // cannons
  ctx.fillStyle='#222'; for(const ox of [-90,90]){ ctx.fillRect(ox-6,10,12,24); ctx.fillStyle=`hsl(200,100%,${60+Math.sin(b.t*10)*20}%)`; ctx.fillRect(ox-4,30,8,6); ctx.fillStyle='#222'; }
  ctx.restore();
}

function drawBullets(){
  ctx.save(); ctx.globalCompositeOperation='lighter';
  for(const b of bullets){
    if(b.kind==='missile'){ ctx.save(); ctx.translate(b.x,b.y); ctx.rotate(Math.atan2(b.vy,b.vx)); ctx.fillStyle='#fc6'; ctx.fillRect(-8,-2.5,16,5); ctx.fillStyle='rgba(255,150,50,.6)'; ctx.beginPath(); ctx.arc(-10,0,6,0,TAU); ctx.fill(); ctx.restore(); continue; }
    const g=ctx.createLinearGradient(b.x,b.y-22,b.x,b.y+6); g.addColorStop(0,'rgba(255,255,255,1)'); g.addColorStop(.4,'rgba(80,230,255,.9)'); g.addColorStop(1,'rgba(0,120,255,0)');
    ctx.fillStyle=g; ctx.save(); ctx.translate(b.x,b.y); ctx.rotate(Math.atan2(b.vx,-b.vy)); ctx.beginPath(); ctx.ellipse(0,-6,3,16,0,0,TAU); ctx.fill(); ctx.restore();
  }
  for(const b of ebullets){
    const pulse = 1+Math.sin(b.t*20)*.2, r=b.r*pulse;
    const g=ctx.createRadialGradient(b.x,b.y,0,b.x,b.y,r*2.2); g.addColorStop(0,'#fff'); g.addColorStop(.35,`hsl(${b.hue},100%,65%)`); g.addColorStop(1,`hsla(${b.hue},100%,50%,0)`);
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(b.x,b.y,r*2.2,0,TAU); ctx.fill();
  }
  ctx.restore();
}

function drawParts(){
  ctx.save();
  for(const p of parts){ if(p.type!=='smoke') continue; const a=p.life/p.max; ctx.fillStyle=`hsla(${p.hue},30%,${20+a*20}%,${a*.35})`; ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,TAU); ctx.fill(); }
  ctx.globalCompositeOperation='lighter';
  for(const p of parts){
    const a=p.life/p.max;
    if(p.type==='spark'){ ctx.strokeStyle=`hsla(${p.hue},100%,${55+a*40}%,${a})`; ctx.lineWidth=p.r*a+.5; ctx.beginPath(); ctx.moveTo(p.x,p.y); ctx.lineTo(p.x-p.vx*.03,p.y-p.vy*.03); ctx.stroke(); }
    else if(p.type==='flash'){ const g=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,p.r); g.addColorStop(0,`rgba(255,255,230,${a})`); g.addColorStop(1,'rgba(255,200,100,0)'); ctx.fillStyle=g; ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,TAU); ctx.fill(); }
  }
  for(const r of rings){ if(r.t<0) continue; const k=r.t/r.life, rr=lerp(r.r,r.max,ease(k)); ctx.strokeStyle=`hsla(${r.hue},100%,70%,${1-k})`; ctx.lineWidth=r.w*(1-k)+.5; ctx.beginPath(); ctx.arc(r.x,r.y,rr,0,TAU); ctx.stroke(); }
  ctx.globalCompositeOperation='source-over';
  for(const d of debris){ ctx.save(); ctx.translate(d.x,d.y); ctx.rotate(d.rot); ctx.fillStyle=`hsl(${d.hue},40%,${30+d.life*30}%)`; ctx.fillRect(-d.s/2,-d.s/2,d.s,d.s*.6); ctx.restore(); }
  ctx.restore();
}

function drawItems(){
  const col = {P:'#fc3',H:'#4f6',S:'#4df',B:'#c6f'};
  for(const it of items){
    ctx.save(); ctx.translate(it.x,it.y+Math.sin(it.t*5)*3);
    const s = 1+Math.sin(it.t*8)*.1; ctx.scale(s,s);
    ctx.shadowColor=col[it.kind]; ctx.shadowBlur=20;
    ctx.rotate(it.t*2); ctx.strokeStyle=col[it.kind]; ctx.lineWidth=2.5; ctx.strokeRect(-13,-13,26,26); ctx.rotate(-it.t*2);
    ctx.fillStyle=col[it.kind]; ctx.beginPath(); ctx.arc(0,0,11,0,TAU); ctx.fill();
    ctx.shadowBlur=0; ctx.fillStyle='#112'; ctx.font='bold 14px system-ui'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(it.kind,0,1);
    ctx.restore();
  }
}

function drawTexts(){
  ctx.save(); ctx.textAlign='center'; ctx.textBaseline='middle';
  for(const t of texts){
    const pop = t.life>.85 ? 1+(t.life-.85)*4 : 1;
    ctx.globalAlpha=Math.min(1,t.life*2); ctx.font=`900 ${t.size*pop}px system-ui`;
    ctx.lineWidth=4; ctx.strokeStyle='rgba(0,0,0,.6)'; ctx.strokeText(t.t,t.x,t.y);
    ctx.fillStyle=t.color; ctx.fillText(t.t,t.x,t.y);
  }
  ctx.restore();
}

function drawHUD(){
  ctx.save();
  ctx.textBaseline='top';
  ctx.font='900 30px system-ui'; ctx.fillStyle='#fff'; ctx.shadowColor='#f0f'; ctx.shadowBlur=12;
  ctx.fillText(Math.round(shownScore).toLocaleString(), 18, 16);
  ctx.shadowBlur=0; ctx.font='600 13px system-ui'; ctx.fillStyle='rgba(255,255,255,.6)';
  ctx.fillText('BEST '+Math.max(best,score).toLocaleString(), 20, 52);
  // hp
  for(let i=0;i<player.maxHp;i++){
    const x=W-30-i*26, y=26, on=i<player.hp;
    ctx.fillStyle = on ? '#f46' : 'rgba(255,255,255,.15)';
    if(on){ ctx.shadowColor='#f46'; ctx.shadowBlur=10; }
    const s = on && player.hp<=2 ? 1+Math.sin(time*10)*.15 : 1;
    ctx.save(); ctx.translate(x,y); ctx.scale(s,s); ctx.beginPath(); ctx.moveTo(0,6); ctx.bezierCurveTo(-12,-4,-6,-14,0,-6); ctx.bezierCurveTo(6,-14,12,-4,0,6); ctx.fill(); ctx.restore();
    ctx.shadowBlur=0;
  }
  // bombs
  ctx.font='700 14px system-ui'; ctx.fillStyle='#c9f'; ctx.textAlign='right';
  ctx.fillText('BOMB ' + '◆'.repeat(player.bombs) + '  [B]', W-18, 46);
  ctx.fillStyle='#fc3'; ctx.fillText('PWR ' + '▮'.repeat(player.power) + '▯'.repeat(4-player.power), W-18, 66);
  // combo
  if(combo>1){
    ctx.textAlign='left'; const k = comboTimer/2;
    ctx.font=`900 ${22+Math.min(combo,40)*.3}px system-ui`; ctx.fillStyle=`hsl(${50-combo},100%,60%)`;
    ctx.fillText(combo+' COMBO', 20, 74);
    ctx.fillStyle='rgba(255,255,255,.2)'; ctx.fillRect(20,106,120,4); ctx.fillStyle='#ff0'; ctx.fillRect(20,106,120*k,4);
  }
  // boss bar
  if(boss){
    const w=W-80, k=boss.hp/boss.maxHp;
    ctx.fillStyle='rgba(0,0,0,.5)'; ctx.fillRect(40,H-30,w,10);
    const g=ctx.createLinearGradient(40,0,40+w,0); g.addColorStop(0,'#f0f'); g.addColorStop(1,'#f40');
    ctx.fillStyle=g; ctx.fillRect(40,H-30,w*k,10);
    ctx.textAlign='center'; ctx.font='800 12px system-ui'; ctx.fillStyle='#fff'; ctx.fillText('MOTHERSHIP', W/2, H-48);
  }
  ctx.restore();
}

function drawBanner(){
  ctx.save(); ctx.textAlign='center'; ctx.textBaseline='middle';
  if(bannerT>0){
    const t = 2.2-bannerT; let x = W/2, a = 1;
    if(t<.35) x = lerp(-W/2, W/2, ease(t/.35)); else if(bannerT<.35) x = lerp(W*1.5, W/2, ease(bannerT/.35));
    ctx.fillStyle='rgba(255,0,200,.18)'; ctx.fillRect(0,H*.35-34,W,68);
    ctx.font='italic 900 46px system-ui'; ctx.shadowColor='#f0f'; ctx.shadowBlur=20; ctx.fillStyle='#fff';
    ctx.fillText(bannerText, x, H*.35);
  }
  if(bossWarn>0){
    const on = Math.floor(bossWarn*4)%2===0;
    ctx.fillStyle=`rgba(255,0,0,${on?.25:.1})`; ctx.fillRect(0,0,W,H);
    ctx.fillStyle='rgba(0,0,0,.6)'; ctx.fillRect(0,H*.4-50,W,100);
    // hazard stripes
    ctx.save(); ctx.beginPath(); ctx.rect(0,H*.4-50,W,12); ctx.rect(0,H*.4+38,W,12); ctx.clip();
    ctx.fillStyle='#fd0'; for(let x=-40+(time*120)%40;x<W+40;x+=40){ ctx.beginPath(); ctx.moveTo(x,H*.4-50); ctx.lineTo(x+20,H*.4-50); ctx.lineTo(x+40-40,H*.4+50+0); ctx.lineTo(x-20,H*.4+50); ctx.closePath(); ctx.fill(); }
    ctx.restore();
    ctx.font='900 54px system-ui'; ctx.fillStyle=on?'#f33':'#fff'; ctx.shadowColor='#f00'; ctx.shadowBlur=30;
    ctx.fillText('⚠ WARNING ⚠', W/2+rand(-2,2), H*.4);
  }
  ctx.restore();
}

function drawTitle(){
  ctx.save(); ctx.textAlign='center'; ctx.textBaseline='middle';
  const y = H*.32 + Math.sin(time*2)*8;
  ctx.font='italic 900 78px system-ui';
  for(let i=4;i>=0;i--){ ctx.fillStyle=`hsla(${300-i*25},100%,60%,${i?0.35:1})`; ctx.fillText('SKY', W/2-i*3, y-50+i*3); ctx.fillText('BLAZE', W/2-i*3, y+30+i*3); }
  ctx.fillStyle='#fff'; ctx.shadowColor='#f0f'; ctx.shadowBlur=30; ctx.fillText('SKY', W/2, y-50); ctx.fillText('BLAZE', W/2, y+30);
  ctx.shadowBlur=0;
  ctx.font='700 20px system-ui'; ctx.globalAlpha=.6+Math.sin(time*5)*.4; ctx.fillStyle='#8ff';
  ctx.fillText('클릭 / 터치 / 아무 키나 눌러 시작', W/2, H*.6);
  ctx.globalAlpha=.7; ctx.font='500 15px system-ui'; ctx.fillStyle='#fff';
  ctx.fillText('이동: 방향키 · WASD · 드래그', W/2, H*.68);
  ctx.fillText('폭탄: B 또는 X  (자동 사격)', W/2, H*.68+24);
  ctx.fillText('아이템  P 파워 · H 체력 · S 실드 · B 폭탄', W/2, H*.68+48);
  ctx.restore();
  // demo jet
  player.x = W/2 + Math.sin(time*1.3)*120; player.y = H*.5+ Math.cos(time*2)*10; player.bank = Math.cos(time*1.3)*.8; player.alive=true; player.inv=0;
  if(Math.random()<.5) for(const ox of [-9,9]) parts.push({x:player.x+ox,y:player.y+28,vx:rand(-20,20),vy:rand(250,400),life:.2,max:.2,r:rand(3,6),hue:rand(180,210),type:'spark',drag:.9});
}

function drawOver(){
  ctx.save(); const k = Math.min(1, overT/1);
  ctx.fillStyle=`rgba(5,0,15,${k*.6})`; ctx.fillRect(0,0,W,H);
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.translate(W/2,H*.38); ctx.scale(lerp(2.5,1,ease(k)),lerp(2.5,1,ease(k))); ctx.globalAlpha=k;
  ctx.font='italic 900 64px system-ui'; ctx.fillStyle='#f36'; ctx.shadowColor='#f06'; ctx.shadowBlur=30;
  ctx.fillText('GAME OVER',0,0);
  ctx.restore();
  ctx.save(); ctx.textAlign='center'; ctx.globalAlpha=Math.min(1,Math.max(0,overT-.5));
  ctx.font='800 28px system-ui'; ctx.fillStyle='#fff'; ctx.fillText('SCORE  '+score.toLocaleString(), W/2, H*.5);
  ctx.font='600 18px system-ui'; ctx.fillStyle= score>=best && score>0 ? '#ff0':'#aaa';
  ctx.fillText(score>=best && score>0 ? '★ NEW BEST ★' : 'BEST  '+best.toLocaleString(), W/2, H*.55);
  ctx.fillText('WAVE '+wave+' 도달', W/2, H*.59);
  if(overT>1.2){ ctx.globalAlpha=.6+Math.sin(time*5)*.4; ctx.fillStyle='#8ff'; ctx.font='700 20px system-ui'; ctx.fillText('클릭 / 아무 키나 눌러 재시작', W/2, H*.68); }
  ctx.restore();
}

function render(){
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.save();
  if(shake>0) ctx.translate(rand(-shake,shake)*.6, rand(-shake,shake)*.6);
  drawBG();
  drawItems();
  enemies.forEach(drawEnemy);
  drawBoss();
  drawParts();
  drawBullets();
  drawPlayer();
  drawTexts();
  ctx.restore();
  // vignette
  const vg=ctx.createRadialGradient(W/2,H/2,H*.3,W/2,H/2,H*.75); vg.addColorStop(0,'rgba(0,0,0,0)'); vg.addColorStop(1,'rgba(0,0,0,.55)');
  ctx.fillStyle=vg; ctx.fillRect(0,0,W,H);
  if(player.alive && player.hp===1 && state==='play'){ ctx.fillStyle=`rgba(255,0,40,${.08+Math.sin(time*6)*.06})`; ctx.fillRect(0,0,W,H); }
  if(flash>0){ ctx.globalAlpha=flash*.7; ctx.fillStyle=flashColor; ctx.fillRect(0,0,W,H); ctx.globalAlpha=1; }
  if(state==='play') { drawHUD(); drawBanner(); }
  if(state==='title') drawTitle();
  if(state==='over') { drawHUD(); drawOver(); }
}

let last = performance.now();
function loop(now){
  const dt = Math.min(.05, (now-last)/1000); last = now;
  update(dt); render();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
